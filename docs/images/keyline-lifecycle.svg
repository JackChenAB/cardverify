<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
  <title id="title">Keyline license lifecycle</title>
  <desc id="desc">A license moves from issue to activation and ongoing verification, then expiry, while administrators can ban or unbind it.</desc>
  <defs>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d2ff9a"/><stop offset="1" stop-color="#9ddb55"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#10251f" stroke-opacity=".04"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9Z" fill="#7da83f"/></marker>
  </defs>
  <rect width="1400" height="430" rx="30" fill="#f2f4ec"/>
  <rect width="1400" height="430" rx="30" fill="url(#grid)"/>
  <text x="64" y="67" font-family="monospace" font-size="12" font-weight="700" fill="#77a832" letter-spacing="3">LICENSE LIFECYCLE / CONTROL LOOP</text>
  <text x="64" y="105" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#10211d">每一組卡密，都有清晰可追蹤的狀態</text>
  <text x="1336" y="68" text-anchor="end" font-family="monospace" font-size="10" fill="#829089">ISSUE → ACTIVATE → VERIFY</text>

  <g fill="none" stroke="#7da83f" stroke-width="2" marker-end="url(#arrow)">
    <path d="M324 236H418"/><path d="M652 236H746"/><path d="M980 236H1074"/>
  </g>
  <g font-family="monospace" font-size="9" fill="#73827b" letter-spacing="1">
    <text x="371" y="221" text-anchor="middle">ACTIVATE</text><text x="699" y="221" text-anchor="middle">HEARTBEAT</text><text x="1027" y="221" text-anchor="middle">TIME ENDS</text>
  </g>

  <g>
    <rect x="64" y="163" width="260" height="146" rx="24" fill="#10251f"/>
    <text x="88" y="193" font-family="monospace" font-size="10" fill="#8ca097">01 / ISSUE</text>
    <text x="88" y="231" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#f5f8ee">批量發行</text>
    <rect x="88" y="254" width="88" height="25" rx="12" fill="#e7ebE4" fill-opacity=".16"/>
    <text x="132" y="271" text-anchor="middle" font-family="monospace" font-size="9" fill="#c6d1cb">UNUSED</text>
    <text x="88" y="296" font-family="Arial, sans-serif" font-size="10" fill="#8fa39a">設定天數或永久授權</text>
  </g>
  <g>
    <rect x="418" y="163" width="234" height="146" rx="24" fill="#fbfcf7" stroke="#d5ddd1"/>
    <text x="442" y="193" font-family="monospace" font-size="10" fill="#87958e">02 / BIND</text>
    <text x="442" y="231" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#10211d">啟用綁機</text>
    <rect x="442" y="254" width="88" height="25" rx="12" fill="url(#mint)"/>
    <text x="486" y="271" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#385d20">ACTIVE</text>
    <text x="442" y="296" font-family="Arial, sans-serif" font-size="10" fill="#718078">HMAC 請求 · HWID 綁定</text>
  </g>
  <g>
    <rect x="746" y="163" width="234" height="146" rx="24" fill="#fbfcf7" stroke="#d5ddd1"/>
    <text x="770" y="193" font-family="monospace" font-size="10" fill="#87958e">03 / VERIFY</text>
    <text x="770" y="231" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#10211d">持續驗證</text>
    <circle cx="782" cy="266" r="5" fill="#79b83f"/>
    <text x="797" y="270" font-family="monospace" font-size="9" font-weight="700" fill="#548f26">ONLINE</text>
    <text x="770" y="296" font-family="Arial, sans-serif" font-size="10" fill="#718078">心跳 · 多開控制 · 簽章回應</text>
  </g>
  <g>
    <rect x="1074" y="163" width="262" height="146" rx="24" fill="#fbfcf7" stroke="#d5ddd1"/>
    <text x="1098" y="193" font-family="monospace" font-size="10" fill="#87958e">04 / CLOSE</text>
    <text x="1098" y="231" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#10211d">到期或撤銷</text>
    <rect x="1098" y="254" width="91" height="25" rx="12" fill="#fff0df"/><text x="1144" y="271" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#bf7533">EXPIRED</text>
    <rect x="1197" y="254" width="81" height="25" rx="12" fill="#fde9e9"/><text x="1238" y="271" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#d84d49">BANNED</text>
    <text x="1098" y="296" font-family="Arial, sans-serif" font-size="10" fill="#718078">管理員可解封、解綁或加時</text>
  </g>

  <path d="M1205 324c0 56-245 65-503 65s-507-9-507-65" fill="none" stroke="#c2ccc0" stroke-dasharray="5 6"/>
  <text x="700" y="386" text-anchor="middle" font-family="monospace" font-size="9" fill="#819088" letter-spacing="1.5">ADMIN RECOVERY · UNBAN · UNBIND · EXTEND</text>
</svg>
