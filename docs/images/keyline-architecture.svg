<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc">
  <title id="title">Keyline deployment architecture</title>
  <desc id="desc">Native clients and administrators connect through the frontend gateway to the NestJS API, PostgreSQL, and Redis.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10251f"/><stop offset="1" stop-color="#081914"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d0ff92"/><stop offset="1" stop-color="#92cf49"/></linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#b7f36b" stroke-opacity=".045"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9Z" fill="#b7f36b"/></marker>
  </defs>
  <rect width="1400" height="500" rx="30" fill="url(#bg)"/>
  <rect width="1400" height="500" rx="30" fill="url(#grid)"/>
  <text x="65" y="68" font-family="monospace" font-size="12" fill="#b7f36b" letter-spacing="3">SYSTEM ARCHITECTURE / REQUEST FLOW</text>
  <text x="65" y="105" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#f4f8ee">從簽章請求到即時授權回應</text>
  <text x="1335" y="70" text-anchor="end" font-family="monospace" font-size="10" fill="#6f8d81">KEYLINE · SELF-HOSTED</text>

  <g fill="none" stroke="#b7f36b" stroke-width="2" stroke-opacity=".7" marker-end="url(#arrow)">
    <path d="M246 223H410"/><path d="M246 365c62 0 70-105 164-105"/><path d="M626 260H774"/><path d="M1010 234h102"/><path d="M1010 292h102"/>
  </g>
  <g font-family="monospace" font-size="9" fill="#91a69d" letter-spacing="1">
    <text x="328" y="211" text-anchor="middle">HMAC-SHA256</text><text x="700" y="248" text-anchor="middle">/api · /admin</text><text x="1061" y="219" text-anchor="middle">PRISMA</text><text x="1061" y="322" text-anchor="middle">SESSIONS</text>
  </g>

  <g>
    <rect x="64" y="166" width="182" height="114" rx="20" fill="#f7f9f3"/>
    <rect x="85" y="187" width="36" height="36" rx="10" fill="url(#mint)"/>
    <path d="M95 205h16m-8-8v16" stroke="#10251f" stroke-width="2"/>
    <text x="85" y="248" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#10211d">Native client</text>
    <text x="85" y="266" font-family="monospace" font-size="9" fill="#6f7f78">ACTIVATE · VERIFY</text>
  </g>
  <g>
    <rect x="64" y="315" width="182" height="100" rx="20" fill="#f7f9f3"/>
    <circle cx="103" cy="349" r="17" fill="#ffb675"/>
    <text x="103" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#10251f">A</text>
    <text x="85" y="390" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#10211d">Admin browser</text>
    <text x="85" y="407" font-family="monospace" font-size="9" fill="#6f7f78">MANAGE · MONITOR</text>
  </g>
  <g>
    <rect x="410" y="192" width="216" height="136" rx="24" fill="#183d31" stroke="#b7f36b" stroke-opacity=".28"/>
    <rect x="432" y="214" width="42" height="42" rx="11" fill="url(#mint)"/>
    <text x="453" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#10251f">K</text>
    <text x="432" y="289" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#f4f8ee">Nginx + Vue 3</text>
    <text x="432" y="309" font-family="monospace" font-size="9" fill="#86a095">GATEWAY · ADMIN UI · :80</text>
  </g>
  <g>
    <rect x="774" y="192" width="236" height="136" rx="24" fill="#f7f9f3"/>
    <circle cx="806" cy="229" r="13" fill="#b7f36b"/>
    <path d="M800 229h12m-6-6v12" stroke="#10251f" stroke-width="2"/>
    <text x="797" y="282" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#10211d">NestJS API</text>
    <text x="797" y="305" font-family="monospace" font-size="9" fill="#6f7f78">ED25519 RESPONSE · :3000</text>
  </g>
  <g>
    <rect x="1112" y="165" width="223" height="112" rx="22" fill="#f7f9f3"/>
    <ellipse cx="1147" cy="202" rx="15" ry="7" fill="#ffb675"/><path d="M1132 202v20c0 4 7 7 15 7s15-3 15-7v-20" fill="none" stroke="#10251f" stroke-width="2"/>
    <text x="1180" y="208" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#10211d">PostgreSQL</text>
    <text x="1180" y="229" font-family="monospace" font-size="9" fill="#6f7f78">LICENSE STATE</text>
  </g>
  <g>
    <rect x="1112" y="304" width="223" height="112" rx="22" fill="#f7f9f3"/>
    <path d="M1133 344l14-8 14 8-14 8Zm0 12 14 8 14-8" fill="none" stroke="#77a832" stroke-width="3"/>
    <text x="1180" y="348" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#10211d">Redis</text>
    <text x="1180" y="369" font-family="monospace" font-size="9" fill="#6f7f78">ONLINE SESSIONS</text>
  </g>
  <text x="700" y="460" text-anchor="middle" font-family="monospace" font-size="10" fill="#769187" letter-spacing="2">DOCKER COMPOSE · FOUR SERVICES · ONE CONTROL PLANE</text>
</svg>
